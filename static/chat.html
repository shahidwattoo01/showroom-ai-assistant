<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showroom Assistant</title>
<style>
  :root { --bg:#0b1221; --panel:#111a2e; --bubble-bot:#1c2742; --bubble-me:#2563eb; --accent:#22c55e; --text:#e8eefc; --muted:#8aa0c6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:linear-gradient(160deg,#0b1221,#132038); color:var(--text); height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 18px; background:var(--panel); border-bottom:1px solid #1e2b49; display:flex; align-items:center; gap:12px; }
  header .logo { width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2563eb,#22c55e);display:grid;place-items:center;font-size:22px; }
  header h1 { font-size:16px;margin:0; } header p { margin:2px 0 0;font-size:12px;color:var(--muted); }
  .status { margin-left:auto;font-size:11px;color:var(--accent);display:flex;align-items:center;gap:6px; }
  .dot { width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent); }
  #log { flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto; }
  .msg { max-width:80%;padding:11px 14px;border-radius:16px;line-height:1.5;font-size:15px;white-space:pre-wrap;word-wrap:break-word;animation:pop .2s ease; }
  @keyframes pop { from{opacity:0;transform:translateY(6px);} to{opacity:1;} }
  .bot { background:var(--bubble-bot);align-self:flex-start;border-bottom-left-radius:4px; }
  .me { background:var(--bubble-me);align-self:flex-end;border-bottom-right-radius:4px; }
  .staff { background:#3f2d12;align-self:flex-start;border-left:3px solid #f59e0b; }
  .msg b, .msg strong { color:#fff; }
  .meta { font-size:10px;color:var(--muted);margin:-6px 0 0 6px; }
  .buttons { display:flex;gap:8px;flex-wrap:wrap;max-width:820px;width:100%;margin:0 auto;padding:0 18px; }
  .buttons button { background:#16223c;border:1px solid #2a3c63;color:var(--text);padding:8px 14px;border-radius:20px;cursor:pointer;font-size:13px; }
  .buttons button:hover { border-color:var(--accent); }
  footer { padding:12px 18px;background:var(--panel);border-top:1px solid #1e2b49; }
  .input { display:flex;gap:10px;max-width:820px;margin:0 auto;align-items:flex-end; }
  textarea { flex:1;resize:none;background:#0d1627;border:1px solid #2a3c63;color:var(--text);border-radius:14px;padding:11px 14px;font-size:15px;font-family:inherit;max-height:120px; }
  .icon-btn { width:46px;height:46px;border-radius:50%;border:none;cursor:pointer;font-size:19px;display:grid;place-items:center;flex-shrink:0; }
  #send { background:var(--accent);color:#06240f; }
  #mic { background:#16223c;color:var(--text);border:1px solid #2a3c63; } #mic.rec { background:#ef4444;color:#fff;animation:pulse 1s infinite; }
  @keyframes pulse { 50%{opacity:.6;} }
  .typing span { display:inline-block;width:7px;height:7px;background:var(--muted);border-radius:50%;animation:blink 1.2s infinite; margin:0 1px;}
  .typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink { 0%,60%,100%{opacity:.3;} 30%{opacity:1;} }
</style>
</head>
<body>
<header>
  <div class="logo">🚗</div>
  <div><h1 id="title">Showroom Assistant</h1><p>AI help · 24/7 · English & اردو</p></div>
  <div class="status"><span class="dot"></span><span id="statusText">Online</span></div>
</header>
<div id="log"></div>
<div class="buttons" id="quick"></div>
<footer>
  <div class="input">
    <button class="icon-btn" id="mic" title="Speak">🎙️</button>
    <textarea id="box" rows="1" placeholder="Type your message…"></textarea>
    <button class="icon-btn" id="send" title="Send">➤</button>
  </div>
</footer>
<script>
const log=document.getElementById('log'), box=document.getElementById('box'), quick=document.getElementById('quick'),
      statusText=document.getElementById('statusText');
let sid=localStorage.getItem('sid')||null, lastId=0, polling=null;

function add(text,cls,meta){ const d=document.createElement('div'); d.className='msg '+cls;
  d.innerHTML=(text||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<b>$1</b>');
  log.appendChild(d); if(meta){const m=document.createElement('div');m.className='meta';m.textContent=meta;log.appendChild(m);}
  log.scrollTop=log.scrollHeight; return d; }
function typing(on){ let t=document.getElementById('typing');
  if(on){ if(!t){t=document.createElement('div');t.id='typing';t.className='msg bot typing';t.innerHTML='<span></span><span></span><span></span>';log.appendChild(t);log.scrollTop=log.scrollHeight;} }
  else if(t) t.remove(); }
function showButtons(list){ quick.innerHTML=''; (list||[]).forEach(b=>{ const btn=document.createElement('button');btn.textContent=b;
  btn.onclick=()=>{quick.innerHTML='';send(b);}; quick.appendChild(btn); }); }

async function start(){ const r=await fetch('/api/chat/start',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({session_id:sid})}); const d=await r.json(); sid=d.session_id; localStorage.setItem('sid',sid);
  document.getElementById('title').textContent=d.showroom; document.title=d.showroom;
  if(d.history&&d.history.length){ d.history.forEach(m=>{ add(m.text, m.role==='customer'?'me':m.role==='staff'?'staff':'bot'); lastId=Math.max(lastId,m.id||0);}); }
  else add(d.welcome,'bot');
  showButtons(d.buttons); poll(); }

async function send(text){ text=(text||box.value).trim(); if(!text) return; box.value=''; box.style.height='auto';
  add(text,'me'); quick.innerHTML=''; typing(true);
  try{ const r=await fetch('/api/chat/send',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session_id:sid,text})}); const d=await r.json(); typing(false);
    if(d.text) add(d.text,'bot', d.status==='human'?null:null); if(d.last_id) lastId=d.last_id;
    if(d.status==='human'){ statusText.textContent='Connected to team'; add('You are now connected to a team member.','staff'); }
    showButtons(d.buttons);
  }catch(e){ typing(false); add('Network error. Please try again.','bot'); } }

async function poll(){ if(polling) return; polling=setInterval(async()=>{ try{
    const r=await fetch('/api/chat/poll?session_id='+sid+'&after='+lastId); const d=await r.json();
    d.messages.forEach(m=>{ add(m.text,'staff'); lastId=Math.max(lastId,m.id); });
    if(d.status==='human') statusText.textContent='Connected to team';
  }catch(e){} },4000); }

// browser voice (Web Speech API)
const mic=document.getElementById('mic'); let rec=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){ rec=new SR(); rec.lang='en-IN'; rec.interimResults=false;
  rec.onresult=e=>{ box.value=e.results[0][0].transcript; send(); };
  rec.onend=()=>mic.classList.remove('rec');
  mic.onclick=()=>{ if(mic.classList.contains('rec')){rec.stop();} else {mic.classList.add('rec'); try{rec.start();}catch(e){}} };
} else { mic.style.display='none'; }

document.getElementById('send').onclick=()=>send();
box.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
box.addEventListener('input',()=>{ box.style.height='auto'; box.style.height=Math.min(box.scrollHeight,120)+'px'; });
start();
</script>
</body>
</html>
